<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goZERO</title>

  <!-- Pico CSS v2 classless — loads FIRST so our overrides win the cascade -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">

  <!-- Bunny Fonts: GDPR-safe Inter (body) + Space Grotesk (display headings) (NOT Google Fonts) -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link rel="stylesheet" href="https://fonts.bunny.net/css2?family=inter:wght@400;500;600;700&family=space-grotesk:wght@500;600;700&display=swap">

  <!-- goZERO stylesheet — loads AFTER Pico so token overrides apply -->
  <link rel="stylesheet" href="/css/main.css?v=18">

  <!-- FOUC prevention: synchronous IIFE, NO defer, NO async, NO external src -->
  <script>
    (function() {
      document.documentElement.classList.add('js');   // enables scroll-reveal CSS (no-JS users keep content visible)
      var stored = localStorage.getItem('gozero-lang');
      if (stored && ['nl','en','de'].indexOf(stored) !== -1) {
        document.documentElement.lang = stored;
      }
    })();
  </script>
</head>
<body>
  <site-nav></site-nav>

  <div class="page-wrap">
  <main>
    <!-- Section 1: Hero — full-width photo banner, white text over a darkened image -->
    <section class="hero hero--banner">
      <img class="hero-bg" src="/img/hero-wijk.webp"
           alt="Woonwijk met zonnepanelen op de daken in het avondlicht">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="hero-eyebrow" data-i18n="home.hero.eyebrow"></p>
          <h1 data-i18n="home.hero.headline"></h1>
          <p class="hero-body" data-i18n="home.hero.body"></p>
          <div class="hero-actions">
            <a href="/contact.html" role="button" class="hero-cta"><span data-i18n="home.hero.cta"></span> <span aria-hidden="true">↗</span></a>
            <a href="#diensten" class="btn-text hero-services"><span data-i18n="home.hero.services_link"></span> <span aria-hidden="true">↓</span></a>
          </div>
          <p class="hero-proof" data-i18n="home.hero.proof"></p>
        </div>
      </div>
    </section>

    <!-- Section 2: Service cards (HV-01) — "Waarmee kunnen we u helpen?" 3 white cards -->
    <section class="section help" id="diensten">
      <div class="section-inner">
        <p class="eyebrow" data-i18n="home.help.eyebrow"></p>
        <div class="help-head">
          <h2 data-i18n="home.help.heading"></h2>
          <p class="help-intro" data-i18n="home.help.intro"></p>
        </div>
        <div class="help-grid">
          <article class="help-card help-card--primary">
            <span class="icon-circle icon-circle--mint"><i data-lucide="wrench" aria-hidden="true"></i></span>
            <h3 data-i18n="home.help.card1.title"></h3>
            <p data-i18n="home.help.card1.desc"></p>
            <a href="/contact.html" class="help-link"><span data-i18n="home.help.card1.link"></span> <span aria-hidden="true">→</span></a>
          </article>
          <article class="help-card">
            <span class="icon-circle icon-circle--yellow"><i data-lucide="euro" aria-hidden="true"></i></span>
            <h3 data-i18n="home.help.card2.title"></h3>
            <p data-i18n="home.help.card2.desc"></p>
            <a href="/contact.html" class="help-link"><span data-i18n="home.help.card2.link"></span> <span aria-hidden="true">→</span></a>
          </article>
          <article class="help-card">
            <span class="icon-circle icon-circle--blue"><i data-lucide="plus" aria-hidden="true"></i></span>
            <h3 data-i18n="home.help.card3.title"></h3>
            <p data-i18n="home.help.card3.desc"></p>
            <a href="#uitbreiden" class="help-link"><span data-i18n="home.help.card3.link"></span> <span aria-hidden="true">→</span></a>
          </article>
        </div>
      </div>
    </section>

    <!-- Section 3: Dark monitoring band (HV-02) — "Opgewekt. Gemonitord. Geregeld." -->
    <section class="section section--monitor" id="zo-werkt-het">
      <div class="section-inner">
        <p class="eyebrow eyebrow--on-dark" data-i18n="home.monitor.eyebrow"></p>
        <div class="monitor-head">
          <div class="monitor-intro">
            <h2 class="monitor-title">
              <span data-i18n="home.monitor.line1"></span>
              <span data-i18n="home.monitor.line2"></span>
              <span data-i18n="home.monitor.line3"></span>
            </h2>
            <p class="monitor-lead" data-i18n="home.monitor.lead"></p>
          </div>

          <!-- Interface fragment (cat 5): a live-performance graph with a detected
               deviation + action status. Decorative (aria-hidden) — it illustrates the
               promise; the accessible version lives in the numbered steps below. -->
          <div class="monitor-panel" aria-hidden="true">
            <div class="panel-top">
              <span class="panel-title" data-i18n="home.monitor.panel.title"></span>
              <span class="panel-range">7d</span>
            </div>
            <svg class="panel-chart" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="prodFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#52B788" stop-opacity="0.35"/>
                  <stop offset="1" stop-color="#52B788" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <!-- faint gridlines -->
              <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
                <line x1="0" y1="40" x2="320" y2="40"/>
                <line x1="0" y1="70" x2="320" y2="70"/>
                <line x1="0" y1="100" x2="320" y2="100"/>
              </g>
              <!-- production area + line (dip at x=208 = the anomaly) -->
              <path d="M10,78 L43,62 L76,70 L109,50 L142,58 L175,44 L208,92 L241,60 L274,52 L307,40 L307,110 L10,110 Z" fill="url(#prodFill)"/>
              <polyline points="10,78 43,62 76,70 109,50 142,58 175,44 208,92 241,60 274,52 307,40"
                        fill="none" stroke="#52B788" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
              <!-- anomaly marker -->
              <circle cx="208" cy="92" r="9" fill="rgba(244,196,48,0.18)"/>
              <circle cx="208" cy="92" r="4" fill="#F4C430"/>
            </svg>
            <div class="panel-alert">
              <span class="alert-dot"></span>
              <span class="alert-text" data-i18n="home.monitor.panel.alert"></span>
              <span class="alert-status" data-i18n="home.monitor.panel.status"></span>
            </div>
          </div>
        </div>

        <div class="monitor-steps">
          <div class="monitor-step">
            <span class="step-num" aria-hidden="true">01</span>
            <h3 data-i18n="home.monitor.s1.title"></h3>
            <p data-i18n="home.monitor.s1.desc"></p>
          </div>
          <div class="monitor-step">
            <span class="step-num" aria-hidden="true">02</span>
            <h3 data-i18n="home.monitor.s2.title"></h3>
            <p data-i18n="home.monitor.s2.desc"></p>
          </div>
          <div class="monitor-step">
            <span class="step-num" aria-hidden="true">03</span>
            <h3 data-i18n="home.monitor.s3.title"></h3>
            <p data-i18n="home.monitor.s3.desc"></p>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat">
            <span class="stat-num" aria-hidden="true">1.100+</span>
            <span class="stat-label" data-i18n="home.monitor.stat1.label"></span>
          </div>
          <div class="stat">
            <span class="stat-num" aria-hidden="true">3</span>
            <span class="stat-label" data-i18n="home.monitor.stat2.label"></span>
          </div>
          <div class="stat">
            <span class="stat-num" aria-hidden="true" data-i18n="home.monitor.stat3.value"></span>
            <span class="stat-label" data-i18n="home.monitor.stat3.label"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 3a: Upsell / "meer uit uw energie" — product showcase (HV upsell) -->
    <section class="section upsell" id="uitbreiden">
      <div class="section-inner">
        <p class="eyebrow" data-i18n="home.upsell.eyebrow"></p>
        <div class="upsell-head">
          <h2 data-i18n="home.upsell.heading"></h2>
          <p class="upsell-lead" data-i18n="home.upsell.lead"></p>
        </div>

        <div class="upsell-stage">
          <!-- Scroll-driven sun that arcs left→right and morphs into a moon (js/components.js) -->
          <div class="celestial" aria-hidden="true">
            <div class="celestial-body">
              <svg class="celestial-sun" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                <g stroke="#F4C430" stroke-width="3" stroke-linecap="round">
                  <line x1="26" y1="7" x2="26" y2="1"/>
                  <line x1="26" y1="51" x2="26" y2="45"/>
                  <line x1="7" y1="26" x2="1" y2="26"/>
                  <line x1="51" y1="26" x2="45" y2="26"/>
                  <line x1="12" y1="12" x2="8" y2="8"/>
                  <line x1="44" y1="44" x2="40" y2="40"/>
                  <line x1="12" y1="40" x2="8" y2="44"/>
                  <line x1="40" y1="12" x2="44" y2="8"/>
                </g>
                <circle cx="26" cy="26" r="12" fill="#F4C430"/>
              </svg>
              <svg class="celestial-moon" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                <circle cx="26" cy="26" r="14" fill="#C7B979"/>
                <circle cx="32" cy="21" r="12" fill="#F5F3EE"/>
              </svg>
            </div>
          </div>
          <!-- Locally-built "smart energy home": panels, home battery, heat pump, charger. No external assets. -->
          <svg class="upsell-art" viewBox="0 0 520 400" role="img"
               aria-label="Illustratie: woning met zonnepanelen, thuisbatterij, warmtepomp en laadpaal"
               xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="upSoft" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B4332" flood-opacity="0.12"/>
              </filter>
            </defs>
            <!-- scene group: darkened as a whole at night (the night-lights below stay bright) -->
            <g class="scene">
            <!-- ground platform -->
            <ellipse cx="260" cy="352" rx="205" ry="30" fill="#D6E7DC"/>
            <!-- (sun/moon is the scroll-driven .celestial element overlaid on the stage) -->
            <!-- clouds -->
            <g fill="#FFFFFF" opacity="0.9">
              <ellipse cx="120" cy="90" rx="40" ry="16"/>
              <ellipse cx="156" cy="80" rx="24" ry="12"/>
            </g>
            <!-- heat pump unit (left of house) -->
            <g filter="url(#upSoft)">
              <rect x="70" y="288" width="70" height="52" rx="10" fill="#EAF2ED" stroke="#C3DBCB" stroke-width="2"/>
              <circle cx="105" cy="314" r="16" fill="#FFFFFF" stroke="#C3DBCB" stroke-width="2"/>
              <g stroke="#52B788" stroke-width="3" stroke-linecap="round">
                <line x1="105" y1="314" x2="105" y2="302"/>
                <line x1="105" y1="314" x2="115" y2="320"/>
                <line x1="105" y1="314" x2="95" y2="320"/>
              </g>
            </g>
            <!-- house -->
            <g>
              <!-- roof -->
              <polygon points="170,182 265,120 360,182" fill="#245740"/>
              <!-- solar panels on roof -->
              <g transform="translate(214 138)">
                <rect x="0" y="0" width="102" height="34" rx="3" fill="#1B4332"/>
                <g stroke="#3C6B54" stroke-width="1.5">
                  <line x1="34" y1="0" x2="34" y2="34"/><line x1="68" y1="0" x2="68" y2="34"/>
                  <line x1="0" y1="17" x2="102" y2="17"/>
                </g>
              </g>
              <!-- wall -->
              <rect x="182" y="182" width="166" height="158" rx="8" fill="#E4EFE7"/>
              <!-- window -->
              <rect x="206" y="214" width="46" height="46" rx="5" fill="#CFE3D6" stroke="#B9D3C2" stroke-width="2"/>
              <!-- door -->
              <rect x="276" y="262" width="46" height="78" rx="5" fill="#245740"/>
              <circle cx="313" cy="302" r="3" fill="#DCEBE2"/>
              <!-- wall-mounted home battery -->
              <g filter="url(#upSoft)">
                <rect x="352" y="226" width="30" height="58" rx="7" fill="#FFFFFF" stroke="#C3DBCB" stroke-width="2"/>
                <rect x="358" y="236" width="18" height="5" rx="2.5" fill="#52B788"/>
                <rect x="358" y="246" width="18" height="5" rx="2.5" fill="#52B788"/>
                <rect x="358" y="256" width="18" height="5" rx="2.5" fill="#DCEBE2"/>
              </g>
            </g>
            <!-- EV charging post + cable (right) -->
            <g filter="url(#upSoft)">
              <rect x="404" y="272" width="16" height="70" rx="7" fill="#245740"/>
              <rect x="407" y="282" width="10" height="14" rx="2" fill="#DCEBE2"/>
              <path d="M420 300 q18 6 12 34" fill="none" stroke="#52B788" stroke-width="3" stroke-linecap="round"/>
            </g>
            </g><!-- /.scene -->

            <!-- Night lights: hidden by day, lit at night (NOT darkened, so they glow) -->
            <g class="night-lights">
              <!-- home battery "on": soft glow halo + all cells lit bright -->
              <ellipse cx="367" cy="255" rx="30" ry="42" fill="#7CF0AE" opacity="0.35"/>
              <rect x="358" y="236" width="18" height="5" rx="2.5" fill="#8CF6BA"/>
              <rect x="358" y="246" width="18" height="5" rx="2.5" fill="#8CF6BA"/>
              <rect x="358" y="256" width="18" height="5" rx="2.5" fill="#8CF6BA"/>
              <!-- lit window (warm) -->
              <rect x="207" y="215" width="44" height="44" rx="4" fill="#F6D67A"/>
              <!-- charging post screen on -->
              <rect x="407" y="282" width="10" height="14" rx="2" fill="#7CF0AE"/>
            </g>
          </svg>

          <!-- PLACEHOLDER savings amounts (home.upsell.p1..p4.save) — illustrative figures.
               Replace with real, provable savings per product before launch. -->
          <div class="upsell-pills">
            <article class="upsell-pill upsell-pill--tl">
              <span class="icon-circle icon-circle--mint"><i data-lucide="flame" aria-hidden="true"></i></span>
              <span class="pill-body">
                <span class="pill-title" data-i18n="home.upsell.p1.title"></span>
                <span class="pill-save" data-i18n="home.upsell.p1.save"></span>
              </span>
            </article>
            <article class="upsell-pill upsell-pill--tr">
              <span class="icon-circle icon-circle--blue"><i data-lucide="gauge" aria-hidden="true"></i></span>
              <span class="pill-body">
                <span class="pill-title" data-i18n="home.upsell.p4.title"></span>
                <span class="pill-save" data-i18n="home.upsell.p4.save"></span>
              </span>
            </article>
            <article class="upsell-pill upsell-pill--bl">
              <span class="icon-circle icon-circle--yellow"><i data-lucide="battery-charging" aria-hidden="true"></i></span>
              <span class="pill-body">
                <span class="pill-title" data-i18n="home.upsell.p2.title"></span>
                <span class="pill-save" data-i18n="home.upsell.p2.save"></span>
              </span>
            </article>
            <article class="upsell-pill upsell-pill--br">
              <span class="icon-circle icon-circle--mint"><i data-lucide="plug-zap" aria-hidden="true"></i></span>
              <span class="pill-body">
                <span class="pill-title" data-i18n="home.upsell.p3.title"></span>
                <span class="pill-save" data-i18n="home.upsell.p3.save"></span>
              </span>
            </article>
          </div>
        </div>

        <!-- 3-step process -->
        <div class="upsell-steps">
          <div class="upsell-step">
            <span class="step-num" aria-hidden="true">01</span>
            <h3 data-i18n="home.upsell.step1.title"></h3>
            <p data-i18n="home.upsell.step1.desc"></p>
          </div>
          <div class="upsell-step">
            <span class="step-num" aria-hidden="true">02</span>
            <h3 data-i18n="home.upsell.step2.title"></h3>
            <p data-i18n="home.upsell.step2.desc"></p>
          </div>
          <div class="upsell-step">
            <span class="step-num" aria-hidden="true">03</span>
            <h3 data-i18n="home.upsell.step3.title"></h3>
            <p data-i18n="home.upsell.step3.desc"></p>
          </div>
        </div>

        <div class="upsell-foot">
          <p class="upsell-partners">
            <i data-lucide="badge-check" aria-hidden="true"></i>
            <span data-i18n="home.upsell.partners"></span>
          </p>
          <a href="/contact.html" role="button" class="upsell-cta"><span data-i18n="home.upsell.cta"></span> <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>

    <!-- Section 3b: Testimonial (cat 9 — human content) -->
    <!-- PLACEHOLDER testimonial: illustrative copy so the section can be designed/reviewed.
         Replace quote + name + location with a REAL customer quote before launch (MED-03).
         Do NOT publish this fabricated quote as-is. -->
    <section class="section testimonial">
      <div class="section-inner">
        <figure class="quote-card">
          <span class="quote-mark" aria-hidden="true">&ldquo;</span>
          <blockquote class="quote-text" data-i18n="home.testimonial.quote"></blockquote>
          <figcaption class="quote-person">
            <span class="quote-avatar" aria-hidden="true" data-i18n="home.testimonial.initials"></span>
            <span class="quote-meta">
              <span class="quote-name" data-i18n="home.testimonial.name"></span>
              <span class="quote-role" data-i18n="home.testimonial.role"></span>
            </span>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- Section 4: FAQ (HV-02) — split layout, reuse faq.items.q1..q6 keys -->
    <section class="section faq" id="faq">
      <div class="section-inner faq-split">
        <div class="faq-intro-col">
          <p class="eyebrow" data-i18n="home.faq.eyebrow"></p>
          <h2 data-i18n="home.faq.heading"></h2>
          <p class="faq-lead" data-i18n="home.faq.intro"></p>
        </div>
        <div class="faq-list">
          <details name="home-faq" open>
            <summary data-i18n="faq.items.q1.question"></summary>
            <p data-i18n="faq.items.q1.answer"></p>
          </details>
          <details name="home-faq">
            <summary data-i18n="faq.items.q2.question"></summary>
            <p data-i18n="faq.items.q2.answer"></p>
          </details>
          <details name="home-faq">
            <summary data-i18n="faq.items.q3.question"></summary>
            <p data-i18n="faq.items.q3.answer"></p>
          </details>
          <details name="home-faq">
            <summary data-i18n="faq.items.q4.question"></summary>
            <p data-i18n="faq.items.q4.answer"></p>
          </details>
          <details name="home-faq">
            <summary data-i18n="faq.items.q5.question"></summary>
            <p data-i18n="faq.items.q5.answer"></p>
          </details>
          <details name="home-faq">
            <summary data-i18n="faq.items.q6.question"></summary>
            <p data-i18n="faq.items.q6.answer"></p>
          </details>
        </div>
      </div>
    </section>

    <!-- Section 5: Golden CTA band (HV-03) -->
    <section class="section section--cta">
      <div class="section-inner cta-inner">
        <div class="cta-copy">
          <p class="eyebrow eyebrow--on-gold" data-i18n="home.cta.eyebrow"></p>
          <h2 data-i18n="home.cta.heading"></h2>
          <p class="cta-body" data-i18n="home.cta.body"></p>
        </div>
        <a href="/contact.html" role="button" class="cta-btn"><span data-i18n="home.cta.button"></span> <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
  </div><!-- /.page-wrap -->

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.552.0/dist/umd/lucide.min.js"></script>
  <!-- components.js FIRST — stamps data-i18n nodes into DOM -->
  <script src="/js/components.js?v=18"></script>
  <!-- i18n.js SECOND — scans for data-i18n nodes after components registered -->
  <script src="/js/i18n.js?v=18"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { lucide.createIcons(); });
  </script>
</body>
</html>
